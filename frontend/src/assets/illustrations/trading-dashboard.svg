<svg width="600" height="400" viewBox="0 0 600 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="400">
            <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
        </linearGradient>
        <linearGradient id="lineGradient" x1="0" y1="0" x2="600" y2="0">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#818cf8" />
        </linearGradient>
        <linearGradient id="candleGreen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#34d399" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="candleRed" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f87171" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
            <feOffset dx="0" dy="10"/>
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.5"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Main Panel Window -->
    <rect x="20" y="20" width="560" height="360" rx="16" fill="url(#chartGradient)" stroke="rgba(255,255,255,0.1)" stroke-width="1" filter="url(#dropShadow)" />
    
    <!-- Window Controls -->
    <circle cx="50" cy="50" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="75" cy="50" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="100" cy="50" r="6" fill="#10b981" opacity="0.8"/>

    <!-- Grid Lines -->
    <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
        <line x1="20" y1="100" x2="580" y2="100" />
        <line x1="20" y1="180" x2="580" y2="180" />
        <line x1="20" y1="260" x2="580" y2="260" />
        <line x1="20" y1="340" x2="580" y2="340" />
        
        <line x1="140" y1="80" x2="140" y2="380" />
        <line x1="280" y1="80" x2="280" y2="380" />
        <line x1="420" y1="80" x2="420" y2="380" />
    </g>

    <!-- Chart Content Group -->
    <g transform="translate(0, 20)">
        <!-- Candlesticks (Simplified) -->
        <!-- Group 1 -->
        <rect x="60" y="200" width="12" height="40" rx="2" fill="url(#candleRed)" />
        <line x1="66" y1="190" x2="66" y2="250" stroke="#ef4444" stroke-width="2" />
        
        <rect x="90" y="220" width="12" height="30" rx="2" fill="url(#candleRed)" />
        <line x1="96" y1="215" x2="96" y2="260" stroke="#ef4444" stroke-width="2" />
        
        <rect x="120" y="180" width="12" height="50" rx="2" fill="url(#candleGreen)" />
        <line x1="126" y1="170" x2="126" y2="240" stroke="#10b981" stroke-width="2" />
        
        <rect x="150" y="160" width="12" height="40" rx="2" fill="url(#candleGreen)" />
        <line x1="156" y1="150" x2="156" y2="210" stroke="#10b981" stroke-width="2" />
        
        <rect x="180" y="170" width="12" height="20" rx="2" fill="url(#candleRed)" />
        <line x1="186" y1="165" x2="186" y2="200" stroke="#ef4444" stroke-width="2" />

        <rect x="210" y="190" width="12" height="60" rx="2" fill="url(#candleGreen)" />
        <line x1="216" y1="180" x2="216" y2="260" stroke="#10b981" stroke-width="2" />

        <rect x="240" y="150" width="12" height="50" rx="2" fill="url(#candleGreen)" />
        <line x1="246" y1="140" x2="246" y2="210" stroke="#10b981" stroke-width="2" />

        <rect x="270" y="130" width="12" height="40" rx="2" fill="url(#candleGreen)" />
        <line x1="276" y1="120" x2="276" y2="180" stroke="#10b981" stroke-width="2" />

        <rect x="300" y="150" width="12" height="30" rx="2" fill="url(#candleRed)" />
        <line x1="306" y1="140" x2="306" y2="190" stroke="#ef4444" stroke-width="2" />
        
        <rect x="330" y="160" width="12" height="20" rx="2" fill="url(#candleRed)" />
        <line x1="336" y1="155" x2="336" y2="190" stroke="#ef4444" stroke-width="2" />
        
        <rect x="360" y="120" width="12" height="50" rx="2" fill="url(#candleGreen)" />
        <line x1="366" y1="110" x2="366" y2="180" stroke="#10b981" stroke-width="2" />

        <rect x="390" y="100" width="12" height="40" rx="2" fill="url(#candleGreen)" />
        <line x1="396" y1="90" x2="396" y2="150" stroke="#10b981" stroke-width="2" />
        
        <rect x="420" y="80" width="12" height="40" rx="2" fill="url(#candleGreen)" />
        <line x1="426" y1="70" x2="426" y2="130" stroke="#10b981" stroke-width="2" />

        <rect x="450" y="90" width="12" height="20" rx="2" fill="url(#candleRed)" />
        <line x1="456" y1="85" x2="456" y2="120" stroke="#ef4444" stroke-width="2" />

        <rect x="480" y="120" width="12" height="30" rx="2" fill="url(#candleRed)" />
        <line x1="486" y1="115" x2="486" y2="160" stroke="#ef4444" stroke-width="2" />

        <rect x="510" y="140" width="12" height="20" rx="2" fill="url(#candleGreen)" />
        <line x1="516" y1="135" x2="516" y2="170" stroke="#10b981" stroke-width="2" />

        <!-- Smooth MA Line -->
        <path d="M40 240 C 100 240, 150 180, 200 200 S 300 160, 350 140 S 450 100, 560 120" stroke="url(#lineGradient)" stroke-width="4" fill="none" filter="url(#glow)" />
    </g>

    <!-- Floating AI Analysis Box -->
    <g transform="translate(380, 220)" filter="url(#dropShadow)">
        <rect x="0" y="0" width="160" height="100" rx="12" fill="rgba(30, 41, 59, 0.95)" stroke="#38bdf8" stroke-width="1.5" />
        
        <!-- Header -->
        <circle cx="20" cy="20" r="4" fill="#38bdf8" />
        <text x="32" y="24" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">AI Insight</text>
        
        <!-- Content -->
        <text x="20" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10">Trend: Bullish ↗</text>
        <text x="20" y="65" fill="#94a3b8" font-family="sans-serif" font-size="10">Confidence: 92%</text>
        
        <!-- Action Button -->
        <rect x="20" y="75" width="60" height="16" rx="4" fill="rgba(56, 189, 248, 0.2)" />
        <text x="50" y="86" fill="#38bdf8" font-family="sans-serif" font-size="9" text-anchor="middle" font-weight="bold">EXECUTE</text>
    </g>

    <!-- Floating Badge -->
    <g transform="translate(80, 300)" filter="url(#dropShadow)">
        <rect x="0" y="0" width="120" height="40" rx="20" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
        <circle cx="20" cy="20" r="4" fill="#10b981">
            <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
        </circle>
        <text x="35" y="24" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">System Online</text>
    </g>

</svg>