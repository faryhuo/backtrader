[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    smoke: Smoke tests (critical, fast health checks)
    api: API/backend tests
    ui: UI/browser tests
    slow: Slow-running tests (may take >10 seconds)

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test output
addopts = -v --tb=short

# Coverage (optional)
# addopts = --cov=auto_test --cov-report=html --cov-report=term

# Test paths
testpaths = e2e smoke

# Timeout (optional - requires pytest-timeout)
# timeout = 300

# Asyncio mode
asyncio_mode = auto
